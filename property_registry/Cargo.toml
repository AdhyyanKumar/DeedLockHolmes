[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.dependencies]
solana-pubkey = "2.2.1"
borsh = "1.5.5"
borsh-derive = "1.5.5"

[patch.crates-io]
solana-pubkey = { path = "patches/solana-pubkey-2.2.1" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
